<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 48" fill="none">
  <!-- 5-Lug Bolt Ring with Torque Notch & Needle -->
  <g transform="translate(4, 4)">
    <circle cx="20" cy="20" r="17" stroke="#C6E84B" stroke-width="2.5" opacity="0.35" />
    <path d="M 32 8 A 17 17 0 1 1 8 32" stroke="#C6E84B" stroke-width="2.5" stroke-linecap="round" />
    <!-- 5 Bolt points -->
    <circle cx="20" cy="8.5" r="2.2" fill="#C6E84B" />
    <circle cx="30.5" cy="16.5" r="2.2" fill="#C6E84B" />
    <circle cx="26.5" cy="29.2" r="2.2" fill="#C6E84B" />
    <circle cx="13.5" cy="29.2" r="2.2" fill="#C6E84B" />
    <circle cx="9.5" cy="16.5" r="2.2" fill="#C6E84B" />
    <!-- Center Needle & Hub -->
    <path d="M20 20L28 9" stroke="#C6E84B" stroke-width="2.75" stroke-linecap="round" />
    <circle cx="20" cy="20" r="4.5" fill="#121417" stroke="#C6E84B" stroke-width="2" />
    <!-- Click Tick Notch -->
    <line x1="33" y1="5" x2="36" y2="2" stroke="#C6E84B" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Wordmark -->
  <text x="56" y="27" font-family="'Familjen Grotesk', 'Public Sans', system-ui, sans-serif" font-weight="600" font-size="22" fill="#F0EFEA" letter-spacing="-0.02em">Torquewell</text>
  <text x="178" y="27" font-family="'Public Sans', system-ui, sans-serif" font-weight="700" font-size="10" fill="#C6E84B" letter-spacing="0.24em">AUTO</text>
  <text x="56" y="39" font-family="'DM Mono', monospace" font-size="8" fill="#98A2AE" letter-spacing="0.12em">EVIDENCE · CALIBRATED · 24/7</text>
</svg>
