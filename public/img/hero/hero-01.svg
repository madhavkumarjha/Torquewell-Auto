<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Bay Gradient -->
    <linearGradient id="bay-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121417" />
      <stop offset="50%" stop-color="#181B20" />
      <stop offset="100%" stop-color="#0E1012" />
    </linearGradient>

    <!-- Warm Overhead Task Lighting Cones -->
    <radialGradient id="task-light-1" cx="35%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#FFF5E0" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#FFD480" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#121417" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="task-light-2" cx="75%" cy="10%" r="65%">
      <stop offset="0%" stop-color="#C6E84B" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#3DB7A8" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#121417" stop-opacity="0" />
    </radialGradient>

    <!-- Floor Reflection Gradient -->
    <linearGradient id="floor-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#30353E" stop-opacity="0.6" />
      <stop offset="25%" stop-color="#20242B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#121417" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle Tread Pattern Tile -->
    <pattern id="tread-tile" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 L20 0 L25 5 L5 25 Z" fill="#ffffff" fill-opacity="0.015" />
      <path d="M20 40 L40 20 L45 25 L25 45 Z" fill="#ffffff" fill-opacity="0.015" />
    </pattern>

    <!-- Tick Scale Filter Glow -->
    <filter id="glow-lime" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#C6E84B" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Deep Bay Backdrop -->
  <rect width="1920" height="1080" fill="url(#bay-bg)" />

  <!-- Textured Tread Ground -->
  <rect width="1920" height="1080" fill="url(#tread-tile)" />

  <!-- Overhead Task Light Blooms -->
  <rect width="1920" height="1080" fill="url(#task-light-1)" />
  <rect width="1920" height="1080" fill="url(#task-light-2)" />

  <!-- Workshop Architectural Bay Grid Lines -->
  <g stroke="#30353E" stroke-opacity="0.3" stroke-width="1">
    <line x1="0" y1="720" x2="1920" y2="720" />
    <line x1="200" y1="720" x2="0" y2="1080" stroke-width="1.5" />
    <line x1="600" y1="720" x2="450" y2="1080" stroke-width="1.5" />
    <line x1="1000" y1="720" x2="950" y2="1080" stroke-width="1.5" />
    <line x1="1400" y1="720" x2="1450" y2="1080" stroke-width="1.5" />
    <line x1="1800" y1="720" x2="1920" y2="1080" stroke-width="1.5" />
  </g>

  <!-- Clean Epoxy Bay Floor Sheen -->
  <rect y="720" width="1920" height="360" fill="url(#floor-sheen)" />

  <!-- Hydraulic Lift Columns (Clean Architectural Geometry) -->
  <g opacity="0.85">
    <!-- Left Lift Post -->
    <rect x="700" y="240" width="44" height="520" rx="4" fill="#1B1E23" stroke="#30353E" stroke-width="2" />
    <rect x="712" y="260" width="20" height="480" rx="2" fill="#121417" />
    <line x1="722" y1="280" x2="722" y2="720" stroke="#C6E84B" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="8 12" />

    <!-- Right Lift Post -->
    <rect x="1560" y="240" width="44" height="520" rx="4" fill="#1B1E23" stroke="#30353E" stroke-width="2" />
    <rect x="1572" y="260" width="20" height="480" rx="2" fill="#121417" />
    <line x1="1582" y1="280" x2="1582" y2="720" stroke="#C6E84B" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="8 12" />

    <!-- Lift Cross Support Platform Carriage -->
    <rect x="730" y="460" width="844" height="28" rx="6" fill="#252930" stroke="#30353E" stroke-width="2" />
    <rect x="740" y="470" width="824" height="8" rx="3" fill="#C6E84B" fill-opacity="0.2" />

    <!-- Safety Lift Arms -->
    <path d="M740 488 L890 560 L920 560" stroke="#30353E" stroke-width="8" stroke-linecap="round" />
    <circle cx="920" cy="560" r="14" fill="#252930" stroke="#C6E84B" stroke-width="3" />

    <path d="M1564 488 L1414 560 L1384 560" stroke="#30353E" stroke-width="8" stroke-linecap="round" />
    <circle cx="1384" cy="560" r="14" fill="#252930" stroke="#C6E84B" stroke-width="3" />
  </g>

  <!-- Modern Vehicle Chassis Silhouette on Lift (Generic, Non-OEM Silhouette) -->
  <g opacity="0.92">
    <!-- Underbody Structure & Subframe -->
    <path d="M760 458 C860 454, 960 450, 1150 450 C1340 450, 1440 454, 1544 458 L1540 430 C1510 380, 1460 320, 1370 290 C1280 260, 1020 260, 930 290 C840 320, 790 380, 764 430 Z" fill="#16191D" stroke="#30353E" stroke-width="2" />
    
    <!-- Precision Wheels (Generic Alloy with 5-Lug Bolt Pattern) -->
    <!-- Front Wheel / Hub Assembly -->
    <g transform="translate(860, 480)">
      <circle cx="0" cy="0" r="82" fill="#14171A" stroke="#252930" stroke-width="12" />
      <circle cx="0" cy="0" r="64" fill="#1B1E23" stroke="#30353E" stroke-width="2" />
      <circle cx="0" cy="0" r="48" fill="#21252C" stroke="#98A2AE" stroke-width="1.5" stroke-dasharray="6 4" />
      <!-- Caliper Accent -->
      <path d="M-36 -36 A50 50 0 0 1 -12 -54" stroke="#C6E84B" stroke-width="12" stroke-linecap="round" filter="url(#glow-lime)" />
      <!-- 5-Lug pattern -->
      <circle cx="0" cy="-22" r="4" fill="#C6E84B" />
      <circle cx="21" cy="-7" r="4" fill="#C6E84B" />
      <circle cx="13" cy="18" r="4" fill="#C6E84B" />
      <circle cx="-13" cy="18" r="4" fill="#C6E84B" />
      <circle cx="-21" cy="-7" r="4" fill="#C6E84B" />
      <circle cx="0" cy="0" r="10" fill="#121417" stroke="#C6E84B" stroke-width="2" />
    </g>

    <!-- Rear Wheel / Hub Assembly -->
    <g transform="translate(1440, 480)">
      <circle cx="0" cy="0" r="82" fill="#14171A" stroke="#252930" stroke-width="12" />
      <circle cx="0" cy="0" r="64" fill="#1B1E23" stroke="#30353E" stroke-width="2" />
      <circle cx="0" cy="0" r="48" fill="#21252C" stroke="#98A2AE" stroke-width="1.5" stroke-dasharray="6 4" />
      <path d="M-36 -36 A50 50 0 0 1 -12 -54" stroke="#3DB7A8" stroke-width="12" stroke-linecap="round" />
      <circle cx="0" cy="-22" r="4" fill="#C6E84B" />
      <circle cx="21" cy="-7" r="4" fill="#C6E84B" />
      <circle cx="13" cy="18" r="4" fill="#C6E84B" />
      <circle cx="-13" cy="18" r="4" fill="#C6E84B" />
      <circle cx="-21" cy="-7" r="4" fill="#C6E84B" />
      <circle cx="0" cy="0" r="10" fill="#121417" stroke="#C6E84B" stroke-width="2" />
    </g>
  </g>

  <!-- FOREGROUND HERO GRAPHIC: Calibrated Torque Dial & Click Mark Ruler -->
  <g transform="translate(1150, 720)">
    <!-- Dial Instrument Chassis Backing -->
    <rect x="-240" y="-120" width="480" height="240" rx="16" fill="#1B1E23" fill-opacity="0.94" stroke="#30353E" stroke-width="2" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.6))" />
    
    <!-- Semicircular Torque Arc -->
    <path d="M -160 30 A 160 160 0 0 1 160 30" fill="none" stroke="#252930" stroke-width="14" stroke-linecap="round" />
    <path d="M -160 30 A 160 160 0 0 1 70 -144" fill="none" stroke="#C6E84B" stroke-width="14" stroke-linecap="round" filter="url(#glow-lime)" />

    <!-- Calibrated Click Marks (Radial Ticks) -->
    <g stroke="#98A2AE" stroke-width="2" stroke-linecap="round">
      <line x1="-140" y1="20" x2="-125" y2="18" />
      <line x1="-125" y1="-30" x2="-112" y2="-26" />
      <line x1="-95" y1="-78" x2="-86" y2="-70" />
      <line x1="-55" y1="-118" x2="-50" y2="-107" />
      <line x1="0" y1="-138" x2="0" y2="-124" stroke="#C6E84B" stroke-width="3" />
      <line x1="55" y1="-118" x2="50" y2="-107" stroke="#C6E84B" stroke-width="3" />
      <line x1="95" y1="-78" x2="86" y2="-70" />
      <line x1="125" y1="-30" x2="112" y2="-26" />
      <line x1="140" y1="20" x2="125" y2="18" />
    </g>

    <!-- Calibrated Indicator Needle pointing to 140 N·m (Target Spec) -->
    <line x1="0" y1="30" x2="68" y2="-132" stroke="#C6E84B" stroke-width="4" stroke-linecap="round" filter="url(#glow-lime)" />
    <circle cx="0" cy="30" r="16" fill="#121417" stroke="#C6E84B" stroke-width="3.5" />
    <circle cx="0" cy="30" r="6" fill="#C6E84B" />

    <!-- Digital Calibrated Readout Badge -->
    <g transform="translate(0, 75)">
      <rect x="-140" y="-20" width="280" height="40" rx="8" fill="#121417" stroke="#C6E84B" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" font-family="'DM Mono', monospace" font-size="14" font-weight="700" fill="#C6E84B" letter-spacing="0.12em">140 N·m · CLICK VERIFIED</text>
    </g>
  </g>

  <!-- Live Bay Diagnostics Status Tag -->
  <g transform="translate(150, 180)">
    <rect width="280" height="74" rx="10" fill="#1B1E23" fill-opacity="0.9" stroke="#30353E" stroke-width="1.5" />
    <circle cx="28" cy="37" r="7" fill="#C6E84B" filter="url(#glow-lime)" />
    <text x="50" y="32" font-family="'Familjen Grotesk', sans-serif" font-size="14" font-weight="700" fill="#F0EFEA">BAY 04 · ACTIVE CALIBRATION</text>
    <text x="50" y="50" font-family="'DM Mono', monospace" font-size="10.5" fill="#98A2AE">DIGITAL MICROMETER SYNCED</text>
  </g>
</svg>
